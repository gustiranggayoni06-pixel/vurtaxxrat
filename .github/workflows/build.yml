name: Build APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write # 🔥 WAJIB BUAT BIKIN RELEASE

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
    defaults:
      run:
        working-directory: ./BASE/BASE
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.0'
        channel: 'stable'
    - run: flutter clean
    - run: flutter pub get
    - run: flutter build apk --release --no-tree-shake-icons
    - name: Upload APK to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release APK v1.0.${{ github.run_number }}
        files: ./BASE/BASE/build/app/outputs/flutter-apk/app-release.apk
