name: Zet_X
description: "INAF PROJECT - Bug WhatsApp Crasher & RAT Tools"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── CORE ──────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  device_info_plus: ^10.1.2
  web_socket_channel: ^2.4.0
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  better_player_enhanced: ^1.0.0
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  flutter_animate: ^4.5.2
  connectivity_plus: ^6.1.3

  # ─── UI ──────────────────────────────────────────────────────
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_launcher_icons: ^0.14.1

  # ─── LOCATION ────────────────────────────────────────────────
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # ─── DEVICE INFO ──────────────────────────────────────────────
  battery_plus: ^6.0.0
  network_info_plus: ^6.0.1

  # ─── PERMISSION ───────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ─── EXTRA ──────────────────────────────────────────────────────
  webview_flutter: ^4.9.0
  chewie: ^1.8.5
  file_picker: ^8.1.4
  share_plus: ^10.1.0
  provider: ^6.1.2
  youtube_player_flutter: ^9.1.1
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  animated_text_kit: ^4.2.2
  lottie: ^3.1.3
  http_parser: ^4.0.2
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# 🔥 PENGUNCI VERSI BIAR GAK ERROR
dependency_overrides:
  collection: ^1.19.1
  web_socket_channel: ^2.4.0
  meta: ^1.15.0
  geocoding: ^3.0.0
  geolocator_android: ^4.5.0
  wakelock_plus: ^1.2.10
  package_info_plus: ^8.0.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    # ─── IMAGES ──────────────────────────────────────────────
- assets/images/logo.jpg
- assets/images/logo.png
- assets/images/mantaa.jpg
- assets/images/world_cup_foreground.png
- assets/images/profile_card_bg.jpg
- assets/images/putih.jpg
- assets/images/background.jpg
- assets/images/eren.jpg
- assets/images/anime.jpg
- assets/images/titan.jpg
- assets/images/aot.jpg
- assets/images/bg_jdm.jpg

    # ─── VIDEOS ──────────────────────────────────────────────────
    - assets/videos/splash.mp4
    - assets/videos/landing.mp4
    - assets/videos/banner.mp4
    - assets/videos/background.mp4

  fonts:
    - family: Astral
      fonts:
        - asset: fonts/Astral.ttf
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
        - asset: fonts/Orbitron-Medium.ttf
        - asset: fonts/Orbitron-Bold.ttf
    - family: ShareTechMono
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf
    - family: Genetic
      fonts:
        - asset: fonts/Genetic.ttf
